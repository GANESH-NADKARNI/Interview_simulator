spring.application.name=interview-simulator
server.port=8080

# MongoDB Atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Groq AI
groq.api.keys=${GROQ_API_KEYS}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.expiration-ms=86400000

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.interview=DEBUG
logging.level.org.springframework.security=WARN

spring.main.allow-bean-definition-overriding=true

brevo.api.key=${BREVO_API_KEY}
brevo.from.email=${BREVO_FROM_EMAIL}
brevo.from.name=InterviewAI

# ✅ NEW: Firebase Admin SDK — path to the service account JSON key file
# In Docker: mount the file and set this env var to /app/firebase-service-account.json
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:/app/firebase-service-account.json}
logging.level.org.springframework.security=DEBUG
logging.level.com.interviewsim=DEBUG
# Firebase debug logging
logging.level.com.google.firebase=DEBUG
logging.level.com.google.auth=DEBUG